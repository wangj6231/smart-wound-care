<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>傷口評估紀錄 | 智慧傷口照護系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { medical: { 500: '#0ea5e9', 600: '#0284c7' } } } } }
    </script>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-medical-600 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-4">
                    <button onclick="window.history.back()" class="text-white hover:bg-medical-700 px-3 py-2 rounded-md transition font-medium">
                        &larr; 返回清單
                    </button>
                    <span class="text-white text-lg font-bold tracking-wider border-l border-blue-400 pl-4">傷口評估與雙軌紀錄</span>
                </div>
                <span id="nurseInfoDisplay" class="text-white text-sm font-medium"></span>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6 flex justify-between items-center">
            <div>
                <h2 class="text-sm text-gray-500 font-medium">目前評估病患</h2>
                <div id="patientInfoDisplay" class="text-2xl font-bold text-gray-900 mt-1">載入中...</div>
            </div>
            <div class="text-right flex items-center space-x-4">
                <button type="button" onclick="openHistoryModal()" class="flex items-center text-medical-600 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg text-sm font-bold transition shadow-sm border border-blue-100">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    查看歷史紀錄
                </button>
                <div class="border-l border-gray-200 pl-4">
                    <p class="text-sm text-gray-500">系統紀錄時間</p>
                    <p id="currentDateDisplay" class="text-lg font-semibold text-gray-700"></p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4">1. 拍攝或上傳傷口影像</h3>
                    
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition cursor-pointer" id="dropZone" onclick="document.getElementById('fileInput').click()">
                        <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <p class="mt-2 text-sm text-gray-600">點擊上傳或拖曳圖片至此</p>
                        <p class="text-xs text-gray-500 mt-1">支援 JPG, PNG 格式</p>
                        <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="previewImage(event)">
                    </div>
                    
                    <div id="imagePreviewContainer" class="hidden mt-4">
                        <img id="imagePreview" src="#" alt="傷口預覽" class="w-full h-auto rounded-lg shadow-sm border border-gray-200">
                        <button onclick="analyzeImage()" class="mt-4 w-full bg-medical-500 text-white py-2 rounded-lg font-medium hover:bg-medical-600 transition shadow-sm">
                            啟動 YOLOv8 AI 辨識
                        </button>
                    </div>
                </div>

                <div id="aiResultBlock" class="hidden bg-blue-50 rounded-xl shadow-sm border border-blue-100 p-6 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                    <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center">
                        <svg class="w-5 h-5 text-blue-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                        AI 客觀判定結果
                    </h3>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="bg-white p-3 rounded shadow-sm">
                            <p class="text-xs text-gray-500 uppercase font-semibold">傷口分級</p>
                            <p id="aiGrade" class="text-xl font-bold text-blue-700 mt-1">Grade X</p>
                        </div>
                        <div class="bg-white p-3 rounded shadow-sm">
                            <p class="text-xs text-gray-500 uppercase font-semibold">信心指數 (Confidence)</p>
                            <p id="aiConfidence" class="text-xl font-bold text-green-600 mt-1">--%</p>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded shadow-sm">
                        <p class="text-xs text-gray-500 uppercase font-semibold mb-1">標準照護建議</p>
                        <p id="aiAdvice" class="text-sm text-gray-700 leading-relaxed"></p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-fit">
                <h3 class="text-lg font-bold text-gray-900 mb-4">2. 護理師臨床判斷紀錄</h3>
                
                <form id="recordForm" class="space-y-5">
                    <input type="hidden" id="patientIdInput">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">臨床傷口分級判定 *</label>
                        <select id="nurseGrade" required class="w-full border-gray-300 rounded-lg shadow-sm focus:border-medical-500 focus:ring-medical-500 p-2.5 border">
                            <option value="">請選擇分級...</option>
                            <option value="Grade 1">Grade 1 (表皮發紅未破損)</option>
                            <option value="Grade 2">Grade 2 (表皮或真皮層部分破損)</option>
                            <option value="Grade 3">Grade 3 (深及皮下組織)</option>
                            <option value="Grade 4">Grade 4 (深及肌肉、肌腱或骨頭)</option>
                            <option value="Unstageable">無法分級 (被壞死組織覆蓋)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">實際處置與照護建議 *</label>
                        <textarea id="nurseAdvice" required rows="5" placeholder="請詳細描述傷口現況（如：有無化膿、滲液顏色）、使用的敷料類型以及給予病患的衛教指示..." class="w-full border-gray-300 rounded-lg shadow-sm focus:border-medical-500 focus:ring-medical-500 p-3 border"></textarea>
                    </div>

                    <div class="pt-4 border-t border-gray-100">
                        <button type="button" onclick="submitRecord()" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition">
                            儲存雙軌紀錄並完成交班
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>
    <div id="historyModal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" onclick="closeHistoryModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            
            <div class="inline-block align-bottom bg-slate-50 rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4 border-b border-gray-200 flex justify-between items-center">
                    <h3 class="text-xl leading-6 font-bold text-gray-900" id="modal-title">病患歷史傷口紀錄</h3>
                    <button onclick="closeHistoryModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                <div class="px-4 py-5 sm:p-6 max-h-[65vh] overflow-y-auto space-y-4" id="historyContent">
                    <p class="text-center text-gray-500 py-4">載入中...</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        // --- 1. 頁面初始化與權限檢查 ---
        const token = localStorage.getItem('access_token');
        const userInfo = JSON.parse(localStorage.getItem('user_info') || '{}');

        if (!token || userInfo.role !== 'nurse') {
            alert('請先登入！');
            window.location.href = 'login.html';
        }

        // 顯示護理師與今日日期
        document.getElementById('nurseInfoDisplay').textContent = `${userInfo.full_name} 護理師`;
        document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('zh-TW');

        // 解析網址上的 patient_id 參數
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('patient_id');
        
        if(patientId) {
            document.getElementById('patientIdInput').value = patientId;
            document.getElementById('patientInfoDisplay').textContent = `病患 ID: ${patientId}`;
            // 實務上這裡會再打一支 API 去撈取該名病患的姓名，但目前為了快速測試，我們直接顯示 ID
        } else {
            alert("未取得病患資訊，請返回首頁重新選擇");
            window.location.href = 'nurse_dashboard.html';
        }


        // --- 2. 影像預覽處理 ---
        function previewImage(event) {
            const input = event.target;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    document.getElementById('dropZone').classList.add('hidden'); // 隱藏虛線框
                    
                    // 重置 AI 區塊 (如果之前有測過的話)
                    document.getElementById('aiResultBlock').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        let lastAnnotatedImageUrl = null;

        // --- 3. 呼叫 YOLOv8 AI 模型 API ---
        async function analyzeImage() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("請先選擇或拖放一張傷口圖片，再進行 AI 辨識！");
                return;
            }

            const btn = event.currentTarget || event.target;
            const originalText = btn.textContent;
            btn.textContent = "AI 分析中，請稍候...";
            btn.disabled = true;
            btn.classList.add('opacity-70');

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    // 將結果渲染到畫面上
                    document.getElementById('aiGrade').textContent = result.ai_grade;
                    // 將 confidence 浮點數轉換成百分比字串 (例如 0.945 -> 94.5%)
                    const confidencePercent = (result.ai_confidence * 100).toFixed(1) + "%";
                    document.getElementById('aiConfidence').textContent = confidencePercent;
                    document.getElementById('aiAdvice').textContent = result.ai_advice;
                    
                    document.getElementById('aiResultBlock').classList.remove('hidden');

                    // 儲存標註影像的 URL 並更新預覽圖為 AI 標註影像，讓護理師看到辨識紅框
                    lastAnnotatedImageUrl = result.annotated_image_url;
                    document.getElementById('imagePreview').src = result.annotated_image_url;
                } else {
                    alert(`AI 辨識失敗：${result.detail}`);
                }
            } catch (error) {
                console.error('Error analyzing image:', error);
                alert('無法連線至 AI 辨識伺服器。');
            } finally {
                // 恢復按鈕狀態
                btn.textContent = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            }
        }

        // --- 4. 提交雙軌紀錄 ---
        async function submitRecord() {
            const patientId = document.getElementById('patientIdInput').value;
            const nurseGrade = document.getElementById('nurseGrade').value;
            const nurseAdvice = document.getElementById('nurseAdvice').value;
            
            // 從畫面上取得 AI 的結果 (如果還沒辨識，預設為空)
            const aiGradeText = document.getElementById('aiGrade').textContent;
            const aiConfidenceText = document.getElementById('aiConfidence').textContent;
            const aiAdvice = document.getElementById('aiAdvice').textContent;
            
            const hasAiResult = !document.getElementById('aiResultBlock').classList.contains('hidden');
            const fileInput = document.getElementById('fileInput');

            // 基礎驗證
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("請先上傳傷口圖片！");
                return;
            }
            if (!nurseGrade || !nurseAdvice) {
                alert("請完整填寫護理師臨床判斷的分級與處置建議！");
                return;
            }
            if (!hasAiResult) {
                if(!confirm("您尚未執行 AI 影像辨識。確定要略過 AI 輔助，直接儲存紀錄嗎？")) {
                    return;
                }
            }

            // 使用 FormData 來打包資料 (包含文字與檔案)
            const formData = new FormData();
            formData.append('patient_id', patientId);
            formData.append('image', fileInput.files[0]); // 加入圖片檔案
            formData.append('nurse_grade', nurseGrade);
            formData.append('nurse_advice', nurseAdvice);
            
            // 處理 AI 資料 (如果有啟動辨識就帶入，否則帶入預設值)
            formData.append('ai_grade', hasAiResult ? aiGradeText : 'None');
            // 將 "94.5%" 轉換回 0.945 的浮點數格式
            const confValue = hasAiResult ? parseFloat(aiConfidenceText.replace('%', '')) / 100 : 0;
            formData.append('ai_confidence', confValue);
            formData.append('ai_advice', hasAiResult ? aiAdvice : '未啟用 AI 輔助');
            
            // 帶入標註影像 URL
            if (hasAiResult && lastAnnotatedImageUrl) {
                formData.append('annotated_image_url', lastAnnotatedImageUrl);
            }

            // 更改按鈕狀態，避免重複點擊
            const submitBtn = event.currentTarget || event.target;
            const originalBtnText = submitBtn.textContent;
            submitBtn.textContent = "儲存中，請稍候...";
            submitBtn.disabled = true;

            try {
                // 發送 POST 請求至後端 API
                const response = await fetch('/api/records', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}` // 記得帶上身分憑證
                    },
                    body: formData // 直接發送 FormData
                });

                const result = await response.json();

                if (response.ok) {
                    alert("🎉 雙軌紀錄成功儲存！交班資訊已更新。");
                    window.location.href = 'nurse_dashboard.html'; // 儲存完畢後退回清單頁
                } else {
                    alert(`儲存失敗：${result.detail}`);
                }
            } catch (error) {
                console.error('Error saving record:', error);
                alert('無法連線至伺服器，儲存失敗。');
            } finally {
                // 恢復按鈕狀態
                submitBtn.textContent = originalBtnText;
                submitBtn.disabled = false;
            }
        }
        // --- 5. 歷史紀錄相關邏輯 ---
        async function openHistoryModal() {
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyContent');
            modal.classList.remove('hidden'); // 顯示視窗
            content.innerHTML = '<p class="text-center text-gray-500 py-8">載入歷史紀錄中...</p>';

            try {
                // 呼叫後端 API 取得該病患的歷史資料
                const response = await fetch(`/api/patients/${patientId}/records`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const result = await response.json();
                
                if (result.data.length === 0) {
                    content.innerHTML = '<p class="text-center text-gray-500 py-8">該病患目前尚無歷史傷口紀錄。</p>';
                    return;
                }

                // 渲染歷史紀錄卡片
                let htmlString = '';
                result.data.forEach(record => {
                    htmlString += `
                        <div class="bg-white rounded-lg border border-gray-200 shadow-sm p-5 flex flex-col md:flex-row gap-6">
                            <div class="md:w-1/3 flex flex-col gap-2">
                                <div class="rounded overflow-hidden flex items-center justify-center border border-gray-200 h-36 bg-gray-50">
                                    <img src="${record.image_url}" class="w-full h-full object-cover" alt="原始照片">
                                </div>
                                ${record.annotated_image_url ? `
                                <div class="rounded overflow-hidden flex items-center justify-center border border-blue-200 h-36 bg-gray-50">
                                    <img src="${record.annotated_image_url}" class="w-full h-full object-cover" alt="AI標註照片">
                                </div>
                                ` : ''}
                            </div>
                            <div class="md:w-2/3 space-y-4">
                                <div class="flex justify-between items-start border-b pb-2">
                                    <div>
                                        <p class="text-sm text-gray-500">紀錄時間</p>
                                        <p class="font-bold text-gray-900">${record.created_at}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm text-gray-500">負責護理師</p>
                                        <p class="font-medium text-medical-600">${record.nurse_name}</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-blue-50 p-3 rounded">
                                        <p class="text-xs text-gray-500 font-bold mb-1">AI 判定 (${(record.ai_confidence * 100).toFixed(1)}%)</p>
                                        <p class="font-bold text-blue-700">${record.ai_grade}</p>
                                        <p class="text-xs text-gray-600 mt-1 line-clamp-2">${record.ai_advice}</p>
                                    </div>
                                    <div class="bg-green-50 p-3 rounded">
                                        <p class="text-xs text-gray-500 font-bold mb-1">護理師臨床判定</p>
                                        <p class="font-bold text-green-700">${record.nurse_grade}</p>
                                        <p class="text-xs text-gray-600 mt-1 line-clamp-2" title="${record.nurse_advice}">${record.nurse_advice}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                content.innerHTML = htmlString;

            } catch (error) {
                console.error('Error fetching history:', error);
                content.innerHTML = '<p class="text-center text-red-500 py-8">無法載入紀錄，請確認網路或伺服器連線。</p>';
            }
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.add('hidden'); // 隱藏視窗
        }   
    </script>

    <!-- Floating AI Chat Widget -->
    <div id="nurseChatBtn" class="fixed bottom-6 right-6 z-50 bg-sky-500 hover:bg-sky-600 text-white rounded-full p-4 shadow-lg hover:shadow-xl transition-all cursor-pointer transform hover:scale-110 flex items-center justify-center w-14 h-14" onclick="toggleNurseChat()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        <span class="absolute -top-1 -right-1 flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-sky-300"></span>
        </span>
    </div>

    <div id="nurseChatBox" class="fixed bottom-24 right-6 z-50 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col w-[380px] h-[500px] hidden opacity-0 translate-y-4 transition-all duration-300">
        <!-- Chat Header -->
        <div class="bg-sky-600 px-4 py-3 text-white flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="relative">
                    <span class="absolute bottom-0 right-0 block h-2 w-2 rounded-full bg-emerald-400 ring-2 ring-sky-600 animate-pulse"></span>
                    <svg class="w-5 h-5 text-sky-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                </div>
                <div>
                    <h3 class="font-bold text-xs tracking-wider">AI 臨床護理顧問</h3>
                    <p class="text-[10px] text-sky-100 font-medium">臨床決策輔助諮詢中</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="clearNurseChat()" class="text-[10px] text-sky-100 hover:text-white transition font-medium">清空</button>
                <button onclick="toggleNurseChat()" class="text-sky-100 hover:text-white transition p-0.5 hover:bg-sky-700 rounded">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="nurseChatMessages" class="flex-grow p-4 overflow-y-auto space-y-3 bg-slate-50 text-xs">
            <div class="flex items-start space-x-2">
                <div class="bg-sky-500 text-white rounded-full p-1 text-[10px] font-bold shadow-sm flex items-center justify-center w-6 h-6">AI</div>
                <div class="bg-white p-2.5 rounded-xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-slate-700 leading-relaxed">
                    您好！我是您的 AI 臨床護理顧問。若在臨床遇到傷口評估、分級指引、先進敷料選擇或處置等疑問，都可以隨時在這裡向我提問喔！
                </div>
            </div>
        </div>

        <!-- Quick Prompts -->
        <div class="px-3 py-1.5 bg-white border-t border-slate-100 flex flex-wrap gap-1.5">
            <button onclick="sendNursePrompt('高滲出液傷口該選哪種敷料？')" class="text-[10px] bg-slate-50 hover:bg-sky-50 hover:text-sky-600 text-slate-600 px-2 py-0.5 rounded-full transition border border-slate-200">高滲出液敷料</button>
            <button onclick="sendNursePrompt('壓瘡三級(Grade 3)的臨床照護要點')" class="text-[10px] bg-slate-50 hover:bg-sky-50 hover:text-sky-600 text-slate-600 px-2 py-0.5 rounded-full transition border border-slate-200">壓瘡三級要點</button>
            <button onclick="sendNursePrompt('如何評估與預防傷口周圍潮濕浸潤？')" class="text-[10px] bg-slate-50 hover:bg-sky-50 hover:text-sky-600 text-slate-600 px-2 py-0.5 rounded-full transition border border-slate-200">周圍浸潤評估</button>
        </div>

        <!-- Chat Input Form -->
        <form id="nurseChatForm" onsubmit="handleNurseChatSubmit(event)" class="p-2 bg-white border-t border-slate-100 flex items-center space-x-1.5">
            <input type="text" id="nurseChatInput" required placeholder="輸入臨床問題..." 
                class="flex-grow px-3 py-1.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-1 focus:ring-sky-500 text-xs transition">
            <button type="submit" id="nurseChatSendBtn" class="bg-sky-600 hover:bg-sky-700 text-white rounded-xl px-3.5 py-1.5 text-xs font-bold shadow-sm transition">
                傳送
            </button>
        </form>
    </div>

    <script>
        // ==========================================
        // Floating AI Chat Assistant for Nurse
        // ==========================================
        let nurseChatHistory = [];

        function toggleNurseChat() {
            const chatBox = document.getElementById('nurseChatBox');
            const isHidden = chatBox.classList.contains('hidden');

            if (isHidden) {
                chatBox.classList.remove('hidden');
                setTimeout(() => {
                    chatBox.classList.remove('opacity-0', 'translate-y-4');
                    chatBox.classList.add('opacity-100', 'translate-y-0');
                }, 10);
            } else {
                chatBox.classList.remove('opacity-100', 'translate-y-0');
                chatBox.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => {
                    chatBox.classList.add('hidden');
                }, 300);
            }
        }

        function formatNurseReply(text) {
            if (!text) return '';
            let escaped = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            
            escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-slate-900">$1</strong>');
            escaped = escaped.replace(/### (.*?)\n/g, '<h4 class="text-xs font-bold text-slate-900 mt-2 mb-1 flex items-center gap-1"><span class="w-1 h-3 bg-sky-500 rounded-full"></span>$1</h4>');
            escaped = escaped.replace(/## (.*?)\n/g, '<h3 class="text-xs font-bold text-slate-900 mt-3 mb-1 border-b pb-0.5">$1</h3>');
            escaped = escaped.replace(/\n/g, '<br>');
            return escaped;
        }

        function appendNurseMessage(role, text) {
            const chatMessages = document.getElementById('nurseChatMessages');
            if (!chatMessages) return;

            const formattedText = formatNurseReply(text);
            const isUser = role === 'user';

            let bubbleHTML = '';
            if (isUser) {
                bubbleHTML = `
                    <div class="flex items-start justify-end space-x-2">
                        <div class="bg-sky-600 text-white p-2.5 rounded-xl rounded-tr-none shadow-sm max-w-[85%] leading-relaxed">
                            ${formattedText}
                        </div>
                        <div class="bg-sky-900 bg-opacity-20 text-sky-900 rounded-full p-1 text-[10px] font-bold shadow-sm flex items-center justify-center w-6 h-6">我</div>
                    </div>
                `;
            } else {
                bubbleHTML = `
                    <div class="flex items-start space-x-2">
                        <div class="bg-sky-500 text-white rounded-full p-1 text-[10px] font-bold shadow-sm flex items-center justify-center w-6 h-6">AI</div>
                        <div class="bg-white p-2.5 rounded-xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-slate-700 leading-relaxed">
                            ${formattedText}
                        </div>
                    </div>
                `;
            }

            chatMessages.insertAdjacentHTML('beforeend', bubbleHTML);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 同步取得父頁面中的 token，如果有的話
        const nurseToken = localStorage.getItem('access_token') || token;

        function showNurseTypingIndicator() {
            const chatMessages = document.getElementById('nurseChatMessages');
            if (!chatMessages) return;

            const indicatorHTML = `
                <div id="nurseTypingIndicator" class="flex items-start space-x-2">
                    <div class="bg-sky-500 text-white rounded-full p-1 text-[10px] font-bold shadow-sm flex items-center justify-center w-6 h-6">AI</div>
                    <div class="bg-white p-2.5 rounded-xl rounded-tl-none shadow-sm border border-slate-100 flex items-center space-x-1">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', indicatorHTML);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeNurseTypingIndicator() {
            const indicator = document.getElementById('nurseTypingIndicator');
            if (indicator) indicator.remove();
        }

        async function handleNurseChatSubmit(event) {
            if (event) event.preventDefault();

            const input = document.getElementById('nurseChatInput');
            const sendBtn = document.getElementById('nurseChatSendBtn');
            const textVal = input.value.trim();
            if (!textVal) return;

            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');

            appendNurseMessage('user', textVal);
            nurseChatHistory.push({ role: 'user', content: textVal });

            showNurseTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${nurseToken}`
                    },
                    body: JSON.stringify({ messages: nurseChatHistory })
                });

                const result = await response.json();
                removeNurseTypingIndicator();

                if (response.ok) {
                    const aiReply = result.reply;
                    appendNurseMessage('assistant', aiReply);
                    nurseChatHistory.push({ role: 'assistant', content: aiReply });
                } else {
                    appendNurseMessage('assistant', `臨床顧問連線異常：${result.detail || '未知的錯誤'}`);
                }
            } catch (error) {
                console.error("臨床對話連線失敗:", error);
                removeNurseTypingIndicator();
                appendNurseMessage('assistant', "連線失敗，請檢查網路。若 AI 離線，請參考系統內建臨床指引。");
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
                input.focus();
            }
        }

        function sendNursePrompt(promptText) {
            const input = document.getElementById('nurseChatInput');
            if (input) {
                input.value = promptText;
                handleNurseChatSubmit();
            }
        }

        function clearNurseChat() {
            nurseChatHistory = [];
            const chatMessages = document.getElementById('nurseChatMessages');
            if (chatMessages) {
                chatMessages.innerHTML = `
                    <div class="flex items-start space-x-2">
                        <div class="bg-sky-500 text-white rounded-full p-1 text-[10px] font-bold shadow-sm flex items-center justify-center w-6 h-6">AI</div>
                        <div class="bg-white p-2.5 rounded-xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-slate-700 leading-relaxed">
                            您好！我是您的 AI 臨床護理顧問。若在臨床遇到傷口評估、分級指引、先進敷料選擇或處置等疑問，都可以隨時在這裡向我提問喔！
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
