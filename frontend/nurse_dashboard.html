<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>護理師控制台 | 智慧傷口照護系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { theme: { extend: { colors: { medical: { 500: '#0ea5e9', 600: '#0284c7' } } } } }
    </script>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-medical-600 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-white text-xl font-bold tracking-wider">智慧傷口照護系統</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="nurseNameDisplay" class="text-white font-medium"></span>
                    <button onclick="logout()" class="text-blue-100 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition">
                        登出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">今日照護病患清單</h1>
                <p class="mt-2 text-sm text-gray-600">請點擊病患卡片進行傷口評估與紀錄</p>
            </div>
        </div>

        <div id="patientGrid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <div class="animate-pulse bg-white overflow-hidden shadow rounded-xl p-6">
                <div class="h-6 bg-slate-200 rounded w-1/3 mb-4"></div>
                <div class="h-4 bg-slate-200 rounded w-1/2 mb-2"></div>
                <div class="h-4 bg-slate-200 rounded w-2/3"></div>
            </div>
        </div>
    </main>

    <script>
        // --- 1. 權限驗證與初始化 ---
        const token = localStorage.getItem('access_token');
        const userInfo = JSON.parse(localStorage.getItem('user_info') || '{}');

        // 如果沒有 Token 或不是護士，踢回登入頁
        if (!token || userInfo.role !== 'nurse') {
            alert('請先以護理師身分登入！');
            window.location.href = 'login.html';
        }

        // 顯示護理師姓名
        document.getElementById('nurseNameDisplay').textContent = `${userInfo.full_name} 護理師`;

        // --- 2. 撈取病患資料並渲染 ---
        async function fetchPatients() {
            try {
                const response = await fetch('/api/nurse/patients', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}` // 攜帶 JWT 憑證
                    }
                });

                if (response.status === 401) {
                    alert('登入已過期，請重新登入');
                    logout();
                    return;
                }

                const result = await response.json();
                const grid = document.getElementById('patientGrid');
                grid.innerHTML = ''; // 清除載入動畫

                if (result.data.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10">今日尚無分配照護的病患</div>`;
                    return;
                }

                // 動態生成病患卡片
                result.data.forEach(patient => {
                    const shiftLabel = getShiftLabel(patient.shift_type);
                    
                    const card = `
                        <div class="bg-white overflow-hidden shadow-sm hover:shadow-md transition-shadow rounded-xl border border-gray-100 cursor-pointer" onclick="goToWoundRecord(${patient.patient_id})">
                            <div class="p-6">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 class="text-xl font-bold text-gray-900">${patient.full_name}</h3>
                                        <p class="text-sm font-medium text-medical-600 mt-1">病床: ${patient.bed_number || '未安排'}</p>
                                    </div>
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                        ${shiftLabel}
                                    </span>
                                </div>
                                <div class="mt-4">
                                    <p class="text-sm text-gray-500 line-clamp-2" title="${patient.medical_history}">
                                        <span class="font-medium text-gray-700">備註：</span>${patient.medical_history || '無特殊病史'}
                                    </p>
                                </div>
                                <div class="mt-6 pt-4 border-t border-gray-100 flex justify-end">
                                    <span class="text-medical-600 text-sm font-medium hover:text-medical-700">進行傷口評估 &rarr;</span>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });

            } catch (error) {
                console.error('Error fetching patients:', error);
                document.getElementById('patientGrid').innerHTML = `<div class="col-span-full text-center text-red-500 py-10">無法取得資料，請確認伺服器狀態</div>`;
            }
        }

        // --- 工具函式 ---
        function getShiftLabel(shiftStr) {
            const shifts = { 'day': '白班', 'evening': '小夜班', 'night': '大夜班' };
            return shifts[shiftStr] || shiftStr;
        }

        function goToWoundRecord(patientId) {
            // 利用網址參數 (Query String) 將病患 ID 帶到下一個頁面
            window.location.href = `wound_assessment.html?patient_id=${patientId}`;
        }
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_info');
            window.location.href = 'login.html';
        }

        // 網頁載入後立即執行撈取資料
        fetchPatients();
    </script>

    <!-- Floating AI Chat Widget -->
    <div id="nurseChatBtn" class="fixed bottom-6 right-6 z-50 bg-sky-500 hover:bg-sky-600 text-white rounded-full p-4 shadow-lg hover:shadow-xl transition-all cursor-pointer transform hover:scale-110 flex items-center justify-center w-14 h-14" onclick="toggleNurseChat()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        <span class="absolute -top-1 -right-1 flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-sky-300"></span>
        </span>
    </div>

    <div id="nurseChatBox" class="fixed bottom-24 right-6 z-50 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col w-[380px] h-[500px] hidden opacity-0 translate-y-4 transition-all duration-300">
        <!-- Chat Header -->
        <div class="bg-sky-600 px-4 py-3 text-white flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="relative">
                    <span class="absolute bottom-0 right-0 block h-2 w-2 rounded-full bg-emerald-400 ring-2 ring-sky-600 animate-pulse"></span>
                    <svg class="w-5 h-5 text-sky-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                </div>
                <div>
                    <h3 class="font-bold text-xs tracking-wider">AI 臨床護理顧問</h3>
                    <p class="text-[10px] text-sky-100 font-medium">臨床決策輔助諮詢中</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="clearNurseChat()" class="text-[10px] text-sky-100 hover:text-white transition font-medium">清空</button>
                <button onclick="toggleNurseChat()" class="text-sky-100 hover:text-white transition p-0.5 hover:bg-sky-700 rounded">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="nurseChatMessages" class="flex-grow p-4 overflow-y-auto space-y-3 bg-slate-50 text-xs">
            <div class="flex items-start space-x-2">
                <div class="bg-sky-500 text-white rounded-full p-1 text-[10px] font-bold shadow-sm flex items-center justify-center w-6 h-6">AI</div>
                <div class="bg-white p-2.5 rounded-xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-slate-700 leading-relaxed">
                    您好！我是您的 AI 臨床護理顧問。若在臨床遇到傷口評估、分級指引、先進敷料選擇或處置等疑問，都可以隨時在這裡向我提問喔！
                </div>
            </div>
        </div>

        <!-- Quick Prompts -->
        <div class="px-3 py-1.5 bg-white border-t border-slate-100 flex flex-wrap gap-1.5">
            <button onclick="sendNursePrompt('高滲出液傷口該選哪種敷料？')" class="text-[10px] bg-slate-50 hover:bg-sky-50 hover:text-sky-600 text-slate-600 px-2 py-0.5 rounded-full transition border border-slate-200">高滲出液敷料</button>
            <button onclick="sendNursePrompt('壓瘡三級(Grade 3)的臨床照護要點')" class="text-[10px] bg-slate-50 hover:bg-sky-50 hover:text-sky-600 text-slate-600 px-2 py-0.5 rounded-full transition border border-slate-200">壓瘡三級要點</button>
            <button onclick="sendNursePrompt('如何評估與預防傷口周圍潮濕浸潤？')" class="text-[10px] bg-slate-50 hover:bg-sky-50 hover:text-sky-600 text-slate-600 px-2 py-0.5 rounded-full transition border border-slate-200">周圍浸潤評估</button>
        </div>

        <!-- Chat Input Form -->
        <form id="nurseChatForm" onsubmit="handleNurseChatSubmit(event)" class="p-2 bg-white border-t border-slate-100 flex items-center space-x-1.5">
            <input type="text" id="nurseChatInput" required placeholder="輸入臨床問題..." 
                class="flex-grow px-3 py-1.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-1 focus:ring-sky-500 text-xs transition">
            <button type="submit" id="nurseChatSendBtn" class="bg-sky-600 hover:bg-sky-700 text-white rounded-xl px-3.5 py-1.5 text-xs font-bold shadow-sm transition">
                傳送
            </button>
        </form>
    </div>

    <script>
        // ==========================================
        // Floating AI Chat Assistant for Nurse
        // ==========================================
        let nurseChatHistory = [];

        function toggleNurseChat() {
            const chatBox = document.getElementById('nurseChatBox');
            const isHidden = chatBox.classList.contains('hidden');

            if (isHidden) {
                chatBox.classList.remove('hidden');
                setTimeout(() => {
                    chatBox.classList.remove('opacity-0', 'translate-y-4');
                    chatBox.classList.add('opacity-100', 'translate-y-0');
                }, 10);
            } else {
                chatBox.classList.remove('opacity-100', 'translate-y-0');
                chatBox.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => {
                    chatBox.classList.add('hidden');
                }, 300);
            }
        }

        function formatNurseReply(text) {
            if (!text) return '';
            let escaped = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            
            escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-slate-900">$1</strong>');
            escaped = escaped.replace(/### (.*?)\n/g, '<h4 class="text-xs font-bold text-slate-900 mt-2 mb-1 flex items-center gap-1"><span class="w-1 h-3 bg-sky-500 rounded-full"></span>$1</h4>');
            escaped = escaped.replace(/## (.*?)\n/g, '<h3 class="text-xs font-bold text-slate-900 mt-3 mb-1 border-b pb-0.5">$1</h3>');
            escaped = escaped.replace(/\n/g, '<br>');
            return escaped;
        }

        function appendNurseMessage(role, text) {
            const chatMessages = document.getElementById('nurseChatMessages');
            if (!chatMessages) return;

            const formattedText = formatNurseReply(text);
            const isUser = role === 'user';

            let bubbleHTML = '';
            if (isUser) {
                bubbleHTML = `
                    <div class="flex items-start justify-end space-x-2">
                        <div class="bg-sky-600 text-white p-2.5 rounded-xl rounded-tr-none shadow-sm max-w-[85%] leading-relaxed">
                            ${formattedText}
                        </div>
                        <div class="bg-sky-900 bg-opacity-20 text-sky-900 rounded-full p-1 text-[10px] font-bold shadow-sm flex items-center justify-center w-6 h-6">我</div>
                    </div>
                `;
            } else {
                bubbleHTML = `
                    <div class="flex items-start space-x-2">
                        <div class="bg-sky-500 text-white rounded-full p-1 text-[10px] font-bold shadow-sm flex items-center justify-center w-6 h-6">AI</div>
                        <div class="bg-white p-2.5 rounded-xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-slate-700 leading-relaxed">
                            ${formattedText}
                        </div>
                    </div>
                `;
            }

            chatMessages.insertAdjacentHTML('beforeend', bubbleHTML);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showNurseTypingIndicator() {
            const chatMessages = document.getElementById('nurseChatMessages');
            if (!chatMessages) return;

            const indicatorHTML = `
                <div id="nurseTypingIndicator" class="flex items-start space-x-2">
                    <div class="bg-sky-500 text-white rounded-full p-1 text-[10px] font-bold shadow-sm flex items-center justify-center w-6 h-6">AI</div>
                    <div class="bg-white p-2.5 rounded-xl rounded-tl-none shadow-sm border border-slate-100 flex items-center space-x-1">
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
                        <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', indicatorHTML);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeNurseTypingIndicator() {
            const indicator = document.getElementById('nurseTypingIndicator');
            if (indicator) indicator.remove();
        }

        async function handleNurseChatSubmit(event) {
            if (event) event.preventDefault();

            const input = document.getElementById('nurseChatInput');
            const sendBtn = document.getElementById('nurseChatSendBtn');
            const textVal = input.value.trim();
            if (!textVal) return;

            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');

            appendNurseMessage('user', textVal);
            nurseChatHistory.push({ role: 'user', content: textVal });

            showNurseTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ messages: nurseChatHistory })
                });

                const result = await response.json();
                removeNurseTypingIndicator();

                if (response.ok) {
                    const aiReply = result.reply;
                    appendNurseMessage('assistant', aiReply);
                    nurseChatHistory.push({ role: 'assistant', content: aiReply });
                } else {
                    appendNurseMessage('assistant', `臨床顧問連線異常：${result.detail || '未知的錯誤'}`);
                }
            } catch (error) {
                console.error("臨床對話連線失敗:", error);
                removeNurseTypingIndicator();
                appendNurseMessage('assistant', "連線失敗，請檢查網路。若 AI 離線，請參考系統內建臨床指引。");
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
                input.focus();
            }
        }

        function sendNursePrompt(promptText) {
            const input = document.getElementById('nurseChatInput');
            if (input) {
                input.value = promptText;
                handleNurseChatSubmit();
            }
        }

        function clearNurseChat() {
            nurseChatHistory = [];
            const chatMessages = document.getElementById('nurseChatMessages');
            if (chatMessages) {
                chatMessages.innerHTML = `
                    <div class="flex items-start space-x-2">
                        <div class="bg-sky-500 text-white rounded-full p-1 text-[10px] font-bold shadow-sm flex items-center justify-center w-6 h-6">AI</div>
                        <div class="bg-white p-2.5 rounded-xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-slate-700 leading-relaxed">
                            您好！我是您的 AI 臨床護理顧問。若在臨床遇到傷口評估、分級指引、先進敷料選擇或處置等疑問，都可以隨時在這裡向我提問喔！
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
